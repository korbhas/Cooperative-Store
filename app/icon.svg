<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <!-- Background Rounded Tile -->
  <rect width="32" height="32" rx="6" fill="#0A3663"/>

  <!-- Shopping Bag Handle -->
  <path d="M11 12 C11 7, 21 7, 21 12" fill="none" stroke="#00CC88" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Shopping Bag Body -->
  <path d="M7 12 L25 12 L23 27 L9 27 Z" fill="#0A3663" stroke="#00CC88" stroke-width="2" stroke-linejoin="round"/>

  <!-- Stylized "TU" Monogram inside -->
